<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{font-family:"Barlow",sans-serif;background:#16171a;color:#fff;position:relative;}
  .og{width:1200px;height:630px;position:relative;display:flex;overflow:hidden;}
  /* left content */
  .left{width:678px;padding:40px 54px 38px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:3;}
  .brand{display:flex;align-items:center;gap:16px;}
  .brand img{height:56px;width:auto;display:block;}
  .eyebrow{font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:15px;letter-spacing:.15em;text-transform:uppercase;color:#E07A12;white-space:nowrap;}
  h1{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:49px;line-height:1.04;letter-spacing:.01em;margin-top:11px;}
  h1 .hl{color:#E07A12;}
  .lead{font-size:19px;color:#c9cdd3;margin-top:14px;max-width:500px;line-height:1.36;}
  .axles{display:flex;gap:11px;margin-top:18px;}
  .chip{font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:16px;letter-spacing:.03em;color:#fff;white-space:nowrap;border:1.5px solid rgba(255,255,255,.28);border-radius:40px;padding:9px 18px;display:flex;align-items:center;gap:9px;}
  .chip .d{width:9px;height:9px;border-radius:50%;background:#E07A12;}
  .foot{display:flex;align-items:center;gap:22px;}
  .phone{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:30px;color:#fff;}
  .phone small{display:block;font-family:"Barlow";font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#8b9098;margin-bottom:2px;}
  .divider{width:1px;height:46px;background:rgba(255,255,255,.18);}
  .meta{font-size:15px;color:#9aa0a8;line-height:1.5;font-weight:500;}
  /* right media */
  .right{position:absolute;right:0;top:0;width:640px;height:630px;}
  .right img{width:100%;height:100%;object-fit:cover;}
  .scrim{position:absolute;inset:0;background:linear-gradient(90deg,#16171a 6%,rgba(22,23,26,.78) 30%,rgba(22,23,26,.15) 62%,rgba(22,23,26,0) 100%);}
  .accent-bar{position:absolute;left:0;top:0;width:10px;height:100%;background:#E07A12;z-index:4;}
</style>
</head>
<body>
  <div class="og">
    <div class="accent-bar"></div>
    <div class="right">
      <img src="https://images.unsplash.com/photo-1721055248349-e398619459cb?fm=jpg&q=80&w=1400&auto=format&fit=crop" alt="" />
    </div>
    <div class="scrim"></div>
    <div class="left">
      <div class="brand"><img src="logo-white.png" alt="Turning Point Alignment" /></div>
      <div>
        <div class="eyebrow">Semi-Truck Wheel Alignment Specialists</div>
        <h1>Precision Alignments for <span class="hl">1, 2 &amp; 3-Axle</span> Rigs</h1>
        <p class="lead">Laser-guided alignments that stop premature tire wear — done right the first time.</p>
        <div class="axles">
          <span class="chip"><span class="d"></span>Single Axle</span>
          <span class="chip"><span class="d"></span>Tandem</span>
          <span class="chip"><span class="d"></span>Tri-Axle</span>
        </div>
      </div>
      <div class="foot">
        <div class="phone"><small>Call now</small>(417) 209-5846</div>
        <div class="divider"></div>
        <div class="meta">Drive-in · Drive-out<br>Hunter &amp; Bee Line equipment</div>
      </div>
    </div>
  </div>
</body>
</html>
